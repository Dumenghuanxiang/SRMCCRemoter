[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srm-xbox-bridge"
version = "0.1.0"
description = "Windows XInput to SRM Campus Competition BLE FFE1/serial bridge"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22,<2",
    "PySide6>=6.8,<7",
    "pyserial>=3.5,<4",
]

[project.scripts]
srm-xbox = "srm_xbox.cli:main"
srm-xbox-gui = "srm_xbox.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
